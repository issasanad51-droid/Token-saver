[package]
name = "token-saver"
version = "0.1.0"
edition = "2021"

[dependencies]
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
axum = { version = "0.7", features = ["http1", "json", "tokio"] }
tower-http = { version = "0.6", features = ["cors"] }
dashmap = "6"
petgraph = "0.6"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
walkdir = "2"
regex = "1"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
redb = "2"
notify = "7"
indexmap = "2"
